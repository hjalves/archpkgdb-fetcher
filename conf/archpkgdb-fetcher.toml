# Config for archpkgdb-fetcher

[fetcher]
current = "./data/%Y-%m-%d/%Y%m%d-%H%M.$repo.$arch.db"
archive = "./data/archive/$year/$year-$month-$day/$year$month$day.$repo.$arch.db"
cache = "./data/cache.json"
archs = ["x86_64"]
repos = [
    "core",
    "core-staging",
    "core-testing",
    "extra",
    "extra-staging",
    "extra-testing",
    "gnome-unstable",
    "kde-unstable",
    "multilib",
    "multilib-staging",
    "multilib-testing",
    # Disabled repositories
    "community",
    "community-staging",
    "community-testing"
]
user_agent = "archpkgdb-fetcher/0.1 (+http://archpkg.org/fetcher)"

[[servers]]
url = "https://ftp.rnl.tecnico.ulisboa.pt/pub/archlinux/$repo/os/$arch"
role = "current"

[[servers]]
url = "https://fastly.mirror.pkgbuild.com/$repo/os/$arch"
role = "current"

[[servers]]
url = "https://archive.archlinux.org/repos/$year/$month/$day/$repo/os/$arch"
role = "archive"

# Logging configuration

[logging.default]
version = 1

[logging.default.root]
handlers = ["console"]
level = "DEBUG"

[logging.default.formatters.colored]
"()" = "colorlog.ColoredFormatter"
datefmt = "%H:%M:%S"
format = """%(asctime)s.%(msecs)03d %(log_color)s[%(levelname)1.1s]%(reset)s \
    %(name_log_color)s%(name)s%(reset)s: %(message)s"""

[logging.default.handlers.console]
class = "logging.StreamHandler"
formatter = "colored"
level = "DEBUG"
stream = "ext://sys.stdout"

[logging.default.loggers.archpkgdb_fetcher]
level = "DEBUG"

[logging.default.loggers.requests]
level = "DEBUG"

[logging.default.loggers.urllib3]
level = "DEBUG"

[logging.default.formatters.colored.log_colors]
DEBUG = "bold_cyan"
INFO = "bold_green"
WARNING = "bold_yellow"
ERROR = "bold_red"
CRITICAL = "bold_purple"

[logging.default.formatters.colored.secondary_log_colors.name]
DEBUG = "bold_white"
INFO = "bold_white"
WARNING = "bold_yellow"
ERROR = "bold_yellow"
CRITICAL = "bold_purple"

# Logging configuration for scheduled tasks (run with -l scheduled)

[logging.scheduled]
version = 1

[logging.scheduled.root]
handlers = ["file"]
level = "DEBUG"

[logging.scheduled.formatters.plain]
"()" = "logging.Formatter"
datefmt = "%b %d %H:%M:%S"
format = "%(asctime)s [%(levelname)1.1s] %(name)s: %(message)s"

[logging.scheduled.handlers.file]
class = "logging.handlers.RotatingFileHandler"
formatter = "plain"
level = "DEBUG"
filename = "archpkgdb-fetcher.log"
maxBytes = 10485760
backupCount = 5

[logging.scheduled.loggers.archpkgdb_fetcher]
level = "DEBUG"

[logging.scheduled.loggers.requests]
level = "DEBUG"

[logging.scheduled.loggers.urllib3]
level = "INFO"
