[project]
name = "archpkgdb-fetcher"
version = "0.1.2"
description = "Fetch updated db files for Arch Linux repos"
readme = "README.md"
authors = [
    { name = "Humberto Alves", email = "hjalves@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.12.0",
    "requests>=2.34.2",
]

[project.scripts]
archpkgdb-fetcher = "archpkgdb_fetcher:main"
archpkgdb-compute-changes = "archpkgdb_fetcher.changes:main"
archpkgdb-generate-indexes = "archpkgdb_fetcher.indexes:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
